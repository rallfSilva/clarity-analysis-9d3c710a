services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: clarity-analysis-dev
    ports:
      - "8086:8080"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true
    restart: unless-stopped

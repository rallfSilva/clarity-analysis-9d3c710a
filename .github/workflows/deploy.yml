# -----------------------------------------------------------------------------
# Deploy automático
# -----------------------------------------------------------------------------
# Dispara sozinho sempre que o workflow "🚀 Release and build" terminar com
# sucesso no branch principal. Não usa GitHub Environments (a conta não tem
# permissão para criá-los neste repositório) — o secret abaixo é lido direto
# do nível repositório em Settings → Secrets and variables → Actions:
#
#     • PORTAINER_DEPLOY_HMG_WEBHOOK_URL
#
# O deploy de produção é manual — ver .github/workflows/deploy-prd.yml.
# -----------------------------------------------------------------------------

name: 🚢 Deploy

on:
  workflow_run:
    workflows: ["🚀 Release and build"]
    types: [completed]
    branches: ["marcelofmatos/vite_react_shadcn_ts"]

concurrency:
  group: deploy-hmg
  cancel-in-progress: false

jobs:
  deploy-hmg:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: 🚀 Trigger Portainer webhook (HMG)
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_DEPLOY_HMG_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::PORTAINER_DEPLOY_HMG_WEBHOOK_URL secret is not set."
            exit 1
          fi
          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"ref":"marcelofmatos/vite_react_shadcn_ts"}' \
            --fail --silent --show-error
          echo "Deploy triggered."
